name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    name: Build APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            \~/.gradle/caches
            \~/.gradle/wrapper
          key: \( {{ runner.os }}-gradle- \){{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ======================
      # BUILD DEBUG (siempre)
      # ======================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ======================
      # BUILD RELEASE (opcional firmado)
      # ======================
      - name: Build Release APK (sin firmar)
        run: ./gradlew assembleRelease --stacktrace
        if: github.event_name != 'pull_request'   # Solo en main / manual

      - name: Upload Release APK (sin firmar)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # Si quieres generar también el AAB (recomendado para Play Store)
      - name: Build Release AAB
        if: github.event_name != 'pull_request'
        run: ./gradlew bundleRelease --stacktrace

