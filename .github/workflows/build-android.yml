name: Build Android APK
on:
  push:
    branches: [ main ]  # Se ejecuta al hacer push a la rama principal
  workflow_dispatch:     # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'  # Ajusta si tu proyecto usa otra versión

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: mi-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
