name: Android Debug Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Localizar proyecto Gradle
      id: locate
      run: |
        set -e
        GRADLEW_PATH=$(find . -name "gradlew" -type f -not -path "*/build/*" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "::error::No se encontró gradlew. Revisa que el wrapper esté commiteado en el repositorio."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Proyecto Gradle encontrado en: $PROJECT_DIR"
        echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
        chmod +x "$GRADLEW_PATH"

    - name: Cache de Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Compilar APK de Debug
      working-directory: ${{ steps.locate.outputs.project_dir }}
      run: ./gradlew assembleDebug --stacktrace
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ steps.locate.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
        if-no-files-found: error