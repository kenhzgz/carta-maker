name: Android Debug Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. Instala Gradle en el runner (no en tu móvil)
    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 'current' # Usa la última versión estable

    # 2. Genera gradlew, gradlew.bat y el jar del wrapper
    - name: Generar Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

    # 3. Ahora que ./gradlew existe, compila normalmente
    - name: Compilar APK de Debug
      run: ./gradlew assembleDebug --stacktrace
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Opcional, bórralo si no usas Gemini

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
